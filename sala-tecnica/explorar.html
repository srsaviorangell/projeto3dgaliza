<main><div class="top">▥ &nbsp;Data center <a href="index.html">Tour por rolagem ↗</a></div><div class="heading"><h1>Visita livre</h1><div class="legend"><i></i> Fibra óptica <i></i> Energia</div></div><section class="stage" id="stage"><span id="err">Carregando a sala…</span><div class="overlay" id="label">Corredor dos racks</div><div class="pad" aria-label="Movimento"><button data-key="w" aria-label="Avançar">↑</button><button data-key="a" aria-label="Ir para a esquerda">←</button><button data-key="s" aria-label="Recuar">↓</button><button data-key="d" aria-label="Ir para a direita">→</button></div></section><div class="foot"><div class="actions"><select id="rack" aria-label="Posicionar câmera"></select><button id="inspect">Ver bayface</button><button id="reset">Voltar à entrada</button></div><small>WASD para andar · arraste para olhar · setas ← → para girar</small></div></main><dialog id="sheet"><button id="close" style="float:right">Fechar</button><h2 id="title"></h2><p>Vista frontal · fase 1 · posições aproximadas conforme o bayface.</p><table id="list"></table></dialog>

const materials=new Map(),cube=new T.BoxGeometry(),batch=new Map(),matrix=new T.Matrix4();

scene.background=new T.Color(0xd9ddd2);
box(0,-.05,0,W,.1,D,'#b2936e');for(let x=-W/2;x<W/2;x+=.375)box(x,.001,0,.003,.003,D,'#927b60');for(let z=-D/2;z<D/2;z+=.375)box(0,.001,z,W,.003,.003,'#927b60');

for(const side of [-1,1]){box(side*(W/2+.05),1.375,0,.1,2.75,D,'#d4d6cb');box(side*(W/2-.105),2.36,0,.21,.31,.89,'#eeeae0');for(let j=0;j<5;j++)box(side*(W/2-.215),2.25+j*.022,0,.015,.009,.77,'#85897e')}
box(-2.55,1.02,D/2-.01,.89,2.04,.035,'#858b7e');box(-2.21,.98,D/2-.04,.10,.024,.038,'#444e45');
for(const x of [-2,0,2])box(x,2.73,.5,.85,.025,.12,'#fffae4');
function tray(z,y,c,start,end){box((start+end)/2,y,z,end-start,.015,.16,c);for(const s of [-1,1])box((start+end)/2,y+.022,z+s*.077,end-start,.048,.008,c);for(let a=start+.15;a<end;a+=.65){box(a,y-.015,z,.03,.028,.21,'#717768');box(a,(2.75+y)/2,z-.09,.012,2.75-y,.012,'#747c71')}}
tray(-1.13,2.30,'#dcad18',-3.29,2.92);tray(-1.38,2.52,'#bd4133',-.48,3.10);
for(let j=0;j<6;j++){box(-.18,2.324,-1.19+j*.021,6.16,.014,.014,j%2?'#f3ce3d':'#e8b830');box(1.31,2.548,-1.442+j*.022,3.54,.018,.018,j%2?'#492e2c':'#342f2c')}
const ys=u=>.085+(u-.5)*unit;
bays.forEach((rows,i)=>{const x=xs[i],n=i?44:36,h=.17+n*unit;
 box(x,h/2,Z-.405,.58,h,.07,'#202721');for(const s of [-1,1]){box(x+s*.284,h/2,Z,.027,h,.86,'#343d36');box(x+s*.253,h/2,front,.022,h,.029,'#465047')}
 for(const y of [.055,h-.045])box(x,y,Z,.60,.085,.90,'#2f372f');
 plaque(x,h-.045,front+.013,.37,.060,rackCode(i)+' / '+names[i]); 
 for(const [u,l,name,k] of rows){const y=(ys(u)+ys(l))/2,dh=(u-l+1)*unit-.003;const color={fiber:'#cbd2c2',org:'#313a34',net:'#808980',power:'#b9bbb0',olt:'#c3c6bc',rect:'#bfc2b5',battery:'#555f55',server:'#a2a9a0'}[k];

 }
 plaque(x+.018,y+dh*.30,front+.014,.30,Math.min(.022,dh*.28),name);
 }
 const max=xs[i],entryZ=front+.03,top=h+.015;
 const fiber=rows.find(row=>row[3]==='fiber');if(fiber){for(let j=0;j<3;j++){const dx=j*.015;wire([[max-.12,2.329,-1.16+dx],[max-.12,2.33,-.94],[max-.20+dx,2.30,-.75],[max-.215+dx,top,-.60],[max-.215+dx,top-.017,front-.04],[max-.215+dx,top-.06,entryZ],[max-.215+dx,ys(fiber[0])-.033,entryZ+.012],[max-.17+dx,ys(fiber[0])-.008,entryZ-.015]],.006,'#e8c440')}}
 if(i){for(let j=0;j<2;j++){const dx=j*.024;wire([[max+.11,2.55,-1.40+dx],[max+.16+dx,2.55,-1.29],[max+.21+dx,2.51,-1.18],[max+.21+dx,top,-.76],[max+.218+dx,top-.05,-.71],[max+.218+dx,.39,-.71]],.009,j?'#51443d':'#342f2b')}}
});

scene.add(new T.HemisphereLight(0xfffbed,0xafb6a8,2.1));const sun=new T.DirectionalLight(0xffefd9,2);sun.position.set(-2,4,3);scene.add(sun);
function clearAt(x,z){return Math.abs(x)<W/2-.145&&Math.abs(z)<D/2-.145&&!xs.some(rx=>Math.abs(x-rx)<.455&&Math.abs(z-Z)<.59)}
function held(key){return keys.has(key)?1:0}
const valid=['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright'];
onkeydown=e=>{const k=e.key.toLowerCase();if($('sheet').open||e.target.tagName==='SELECT'||!valid.includes(k))return;e.preventDefault();keys.add(k)};onkeyup=e=>keys.delete(e.key.toLowerCase());onblur=()=>keys.clear();

let renderer;try{renderer=new T.WebGLRenderer({antialias:true})}catch{$('err').textContent='O navegador não conseguiu abrir o 3D. Você ainda pode consultar os seis bayfaces.'}

new ResizeObserver(()=>{const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();dirty=true}).observe(stage);
let last=0;function frame(t){requestAnimationFrame(frame);const dt=Math.min(.05,(t-last)/1000);last=t;
 if(keys.size&&!$('sheet').open){const f=held('w')+held('arrowup')-held('s')-held('arrowdown'),s=held('d')-held('a'),len=Math.max(1,Math.hypot(f,s));yaw+=(held('arrowleft')-held('arrowright'))*dt*1.55;
 const x=pos.x+(-Math.sin(yaw)*f+Math.cos(yaw)*s)*dt*1.3/len,z=pos.z+(-Math.cos(yaw)*f-Math.sin(yaw)*s)*dt*1.3/len;if(clearAt(x,pos.z))pos.x=x;if(clearAt(pos.x,z))pos.z=z;dirty=true}
 if(!dirty)return;dirty=false;cam.position.copy(pos);cam.rotation.order='YXZ';cam.rotation.set(pitch,yaw,0,'YXZ');const near=xs.reduce((a,x,i)=>Math.abs(x-pos.x)<Math.abs(xs[a]-pos.x)?i:a,0);active=near;$('label').textContent=rackCode(near)+' · '+names[near];renderer.render(scene,cam)}
